name: NEXRYN Cross-Mode Regression Gate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - clean-main
      - main
      - master

permissions:
  contents: read

jobs:
  cross-mode-regression:
    name: Cross-Mode Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Adaptive smoke and semantic parity tests
        run: |
          python -m pytest \
            tests/test_unified_execution_architecture.py \
            tests/test_shared_cognitive_state.py \
            tests/test_cross_mode_parity.py \
            tests/test_cognitive_runtime_execution_engine.py \
            tests/test_execution_binding_layer.py \
            tests/test_deep_mode_optimization.py

      - name: Cross-mode semantic regression gate
        run: python tools/cross_mode_regression_gate.py

  executor-semantic-contract:
    name: Executor Semantic Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify executor semantic contract
        run: |
          python tools/executor_contract_ci.py
          python -m pytest tests/test_executor_contract_ci.py tests/test_candidate_semantic_equivalence.py
